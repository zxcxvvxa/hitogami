user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Dynamic Connection header mapping for WebSocket handshakes
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # Exact match for root redirect
        location = / {
            return 302 https://m.youtube.com/watch?v=dQw4w9WgXcQ;
        }

        # VLESS WebSocket Endpoint (Sing-Box backend)
        location /hitogami {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10001;
            
            # Disable buffering for real-time WebSocket traffic
            proxy_buffering off;
            proxy_http_version 1.1;

            # Handshake & Forwarding Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

            # Extended Timeouts for persistent VPN/proxy connections
            proxy_connect_timeout 60s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Catch-all redirect for any other path
        location / {
            return 302 https://m.youtube.com/watch?v=dQw4w9WgXcQ;
        }
    }
}
